image: node:22.12.0

pages:
    stage: deploy
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - .npm/
    script:
        - npm ci --cache .npm --prefer-offline
        - npm run build
        - rm -rf public
        - mv web/dist public
        - test -s public/index.html
    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
