name: Wiki CI/CD

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        name: verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            - run: npm run build

